default: &default
  num_data_workers: 16
  # model
  reps: 2
  depth: 9
  filters: 32
  input_kernel: 7
  coord_conv: !!bool True
  pool_mode: 'sum'
  spatial_size: 292
  num_input: 4
  feature_size: 1
  allow_bias: !!bool False
  # optimization
  lr: 0.0001
  lr_epochs_low: 20
  lr_epochs_high: 60
  lr_start_factor: 1.0
  lr_decay_gamma: 0.975
  optimizer: 'Adam'
  max_epochs: 150
  batch_size: 3125
  valid_batch_size: 500
  bn_momentum: 0.01
  # misc
  log_to_screen: !!bool True
  save_checkpoint: !!bool True
  # data locations
  train_path: '/pscratch/sd/e/ehinkle/nd_ana/sheep_single_shower/ELECTRON_SAMPLES/CONVERT2H5/TRAIN/'
  test_path: '/pscratch/sd/e/ehinkle/nd_ana/sheep_single_shower/ELECTRON_SAMPLES/CONVERT2H5/TEST/'
  val_path: '/pscratch/sd/e/ehinkle/nd_ana/sheep_single_shower/ELECTRON_SAMPLES/CONVERT2H5/VALIDATION/'
  train_files: 4000
  val_files: 1000
  test_files: 1000
  # detector-based data augmentation
  detector_active_regions: [[[  3.069, -62.076,   2.4620001],
                             [ 63.931,  62.076,  64.538]],
                            [[  3.069, -62.076, -64.538],
                             [ 63.931,  62.076,  -2.4620001]],
                            [[-63.931, -62.076,   2.462],
                             [ -3.069,  62.076,  64.537994]],
                            [[-63.931, -62.076, -64.538],
                             [ -3.069,  62.076, -2.4620001]]]
  random_seed: 0
  voxel_size: [0.4434, 0.4434, 0.4434]
  min_visible_energy: 2.0
  fid_vol_cut: 2.0

# Variations on the default config for different training and evaluation scenarios
mse_lin:
  <<: *default
  loss_fn: 'MSELoss'
  train_logE: !!bool False

mse_log:
  <<: *default
  loss_fn: 'MSELoss'
  train_logE: !!bool True

l1_lin:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool False

l1_log:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool True

huber_lin:
  <<: *default
  loss_fn: 'HuberLoss'
  train_logE: !!bool False

huber_log:
  <<: *default  
  loss_fn: 'HuberLoss'
  train_logE: !!bool True

# Configs for testing the trained model on the test set, with some modifications for stability and speed
test: &test # inherit configs from the alias default
  <<: *default
  test_batch_size: 500
  # Energy scaled to /1000 for training stability
  energy_scaled: 1000.0

test_mse_lin:
  <<: *test
  loss_fn: 'MSELoss'
  train_logE: !!bool False

test_mse_log:
  <<: *test
  loss_fn: 'MSELoss'
  train_logE: !!bool True

test_l1_lin:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool False

test_l1_log:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool True

test_huber_lin:
  <<: *test
  loss_fn: 'HuberLoss'
  train_logE: !!bool False

test_huber_log:
  <<: *test
  loss_fn: 'HuberLoss'    
  train_logE: !!bool True

