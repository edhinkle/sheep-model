# Variations on the default config for different training and evaluation scenarios
mse_lin:
  <<: *default
  loss_fn: 'MSELoss'
  train_logE: !!bool False

weighted_mse_lin:
  <<: *default
  loss_fn: 'WeightedMSELoss'
  train_logE: !!bool False

mse_log:
  <<: *default
  loss_fn: 'MSELoss'
  train_logE: !!bool True

l1_lin:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool False

weighted_l1_lin:
  <<: *default
  loss_fn: 'WeightedL1Loss'
  train_logE: !!bool False

l1_log:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool True

huber_lin:
  <<: *default
  loss_fn: 'HuberLoss'
  train_logE: !!bool False

huber_log:
  <<: *default  
  loss_fn: 'HuberLoss'
  train_logE: !!bool True

# Configs for testing the trained model on the test set, with some modifications for stability and speed
test: &test # inherit configs from the alias default
  <<: *default
  test_batch_size: 100
  # Energy scaled to /1000 for training stability
  energy_scaled: 1000.0

test_mse_lin:
  <<: *test
  loss_fn: 'MSELoss'
  train_logE: !!bool False

test_weighted_mse_lin:
  <<: *test
  loss_fn: 'WeightedMSELoss'
  train_logE: !!bool False

test_mse_log:
  <<: *test
  loss_fn: 'MSELoss'
  train_logE: !!bool True

test_l1_lin:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool False

test_weighted_l1_lin:
  <<: *test
  loss_fn: 'WeightedL1Loss'
  train_logE: !!bool False

test_l1_log:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool True

test_huber_lin:
  <<: *test
  loss_fn: 'HuberLoss'
  train_logE: !!bool False

