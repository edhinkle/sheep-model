  random_seed: 0
  voxel_size: [0.4, 0.4, 0.4]
  min_visible_energy: 2.0
  inner_wall_fv_cut: 5.0
  outer_wall_fv_cut: 50.0
  ds_wall_fv_cut: 150.0
  full_fv_cut: !!bool False # If false, only inner wall FV cut will be applied.
  # photons vs. electrons
  photons_in_sample: !!bool False
  electrons_in_sample: !!bool True
  event_vertex_in_fv: !!bool False #TODO: Fix so this can be used
  particle_start_in_fv: !!bool True
  energy_threshold: 0.100 # MeV
  set_energy_threshold: !!bool False
  #log train and val predictions
  log_train_preds: !!bool False
  log_val_preds: !!bool False
  energy_scaled: 1000.0
  # Energy scaled to /1000 for training stability
  transform_showers: !!bool True

# Variations on the default config for different training and evaluation scenarios
mse_lin:
  <<: *default
  loss_fn: 'MSELoss'
  train_logE: !!bool False

weighted_mse_lin:
  <<: *default
  loss_fn: 'WeightedMSELoss'
  train_logE: !!bool False

mse_log:
  <<: *default
  loss_fn: 'MSELoss'
  train_logE: !!bool True

l1_lin:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool False

weighted_l1_lin:
  <<: *default
  loss_fn: 'WeightedL1Loss'
  train_logE: !!bool False

l1_lin_wd1e-4:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool False
  weight_decay: 0.0001

l1_lin_wd1e-5:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool False
  weight_decay: 0.00001

l1_lin_wd1e-3:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool False
  weight_decay: 0.001

l1_log:
  <<: *default
  loss_fn: 'L1Loss'
  train_logE: !!bool True

l1_log_with_VE_frac:
  <<: *default
  loss_fn: 'LogEandVEFracL1Loss'
  train_logE: !!bool True

huber_lin:
  <<: *default
  loss_fn: 'HuberLoss'
  train_logE: !!bool False

huber_log:
  <<: *default  
  loss_fn: 'HuberLoss'
  train_logE: !!bool True

# Configs for testing the trained model on the test set, with some modifications for stability and speed
test: &test # inherit configs from the alias default
  <<: *default
  test_batch_size: 100
  # Energy scaled to /1000 for training stability
  energy_scaled: 1000.0

test_mse_lin:
  <<: *test
  loss_fn: 'MSELoss'
  train_logE: !!bool False

test_weighted_mse_lin:
  <<: *test
  loss_fn: 'WeightedMSELoss'
  train_logE: !!bool False

test_mse_log:
  <<: *test
  loss_fn: 'MSELoss'
  train_logE: !!bool True

test_l1_lin:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool False

test_l1_lin_wd1e-3:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool False
  weight_decay: 0.001

test_l1_lin_wd1e-4:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool False
  weight_decay: 0.0001

test_l1_lin_wd1e-5:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool False
  weight_decay: 0.00001

test_weighted_l1_lin:
  <<: *test
  loss_fn: 'WeightedL1Loss'
  train_logE: !!bool False

test_l1_log:
  <<: *test
  loss_fn: 'L1Loss'
  train_logE: !!bool True

test_l1_log_with_VE_frac:
  <<: *test
  loss_fn: 'LogEandVEFracL1Loss'
  train_logE: !!bool True

test_huber_lin:
  <<: *test
  loss_fn: 'HuberLoss'
  train_logE: !!bool False

test_huber_log:
  <<: *test
  loss_fn: 'HuberLoss'    
  train_logE: !!bool True

